name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Assert tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(bun -e 'import { OXMCP_VERSION } from "./src/version.ts"; console.log(OXMCP_VERSION)')"
          json_ver="$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n1)"
          if [ -z "${pkg}" ] || [ -z "${json_ver}" ]; then
            echo "Could not read version from src/version.ts (${pkg}) or package.json (${json_ver})"
            exit 1
          fi
          if [ "${pkg}" != "${json_ver}" ]; then
            echo "OXMCP_VERSION (${pkg}) does not match package.json (${json_ver})"
            exit 1
          fi
          if [ "${tag}" != "${pkg}" ]; then
            echo "Tag v${tag} does not match release version (${pkg})"
            exit 1
          fi

      - name: Build release binaries
        run: |
          mkdir -p dist
          bun build --compile --target=bun-linux-x64 --outfile=dist/oxmcp-linux-x64 index.ts
          bun build --compile --target=bun-darwin-arm64 --outfile=dist/oxmcp-darwin-arm64 index.ts
          bun build --compile --target=bun-darwin-x64 --outfile=dist/oxmcp-darwin-x64 index.ts
          (cd dist && sha256sum oxmcp-* > SHA256SUMS)

      - name: Smoke test linux binary
        run: |
          dist/oxmcp-linux-x64 --version
          dist/oxmcp-linux-x64 print-mcp-config | head -n 5

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/oxmcp-linux-x64
            dist/oxmcp-darwin-arm64
            dist/oxmcp-darwin-x64
            dist/SHA256SUMS
          generate_release_notes: true
