name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Assert tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' src/version.ts | head -n1)"
          if [ "${tag}" != "${pkg}" ]; then
            echo "Tag v${tag} does not match src/version.ts (${pkg})"
            exit 1
          fi

      - name: Build release binaries
        run: |
          mkdir -p dist
          bun build --compile --target=bun-linux-x64 --outfile=dist/oxmcp-linux-x64 index.ts
          bun build --compile --target=bun-darwin-arm64 --outfile=dist/oxmcp-darwin-arm64 index.ts
          bun build --compile --target=bun-darwin-x64 --outfile=dist/oxmcp-darwin-x64 index.ts
          (cd dist && sha256sum oxmcp-* > SHA256SUMS)

      - name: Smoke test linux binary
        run: |
          dist/oxmcp-linux-x64 --version
          dist/oxmcp-linux-x64 print-mcp-config | head -n 5

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/oxmcp-linux-x64
            dist/oxmcp-darwin-arm64
            dist/oxmcp-darwin-x64
            dist/SHA256SUMS
          generate_release_notes: true
